.rsi-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.rsi-card{background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);width:min(440px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.rsi-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.rsi-head b{font-size:15px}
.rsi-head span{display:block;font-size:12px;color:var(--sub2);margin-top:2px}
.rsi-x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--sub2);cursor:pointer;padding:2px 6px}
.rsi-body{overflow-y:auto;padding:16px;background:var(--surface)}
.rsi-body img{display:block;width:100%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.rsi-foot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.rsi-hint{font-size:12px;color:var(--sub2);margin-right:auto}
.rsi-pri{background:var(--acc);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:14px;text-decoration:none;cursor:pointer}
.rsi-sec{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}

.rd-btn.xsite-inline{text-decoration:none;color:var(--acc);border-color:var(--acc)}
.rd-btn.xsite-inline:hover{background:rgba(10,118,233,.08)}

.ppl-more{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;background:var(--surface);border:1px dashed var(--line);border-radius:16px;gap:4px}
.pm-n{width:56px;height:56px;border-radius:50%;background:var(--surface2);color:var(--acc);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pm-t{font-size:14px;font-weight:600;color:var(--ink);margin-top:6px}
.pm-c{font-size:12px;color:var(--acc)}
@media(max-width:640px){
  .ppl-grid{grid-template-columns:repeat(2,1fr)!important;gap:10px}
  .site-tag{font-size:12px;gap:8px;padding-top:14px}
  .site-tag .st-n{padding-left:8px}
  .hero-ten{display:none}
  .rail .paper-card{flex-basis:82%}
  .home-ppl .ppl-card:nth-child(n+18){display:none}
  .home-ppl a.ppl-card.ppl-more{display:flex}
  .nav{gap:12px;padding:0 12px;height:52px}
  .read-bar{top:52px}
  .links{gap:14px;font-size:13.5px;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;flex-wrap:nowrap;scrollbar-width:none}
  .links::-webkit-scrollbar{display:none}
  .links a{padding:11px 1px}
  .brand{flex:none;font-size:16px;gap:5px}
  .navtools{flex:none}
}

/* 卡片作者头像(继续阅读 + 最新论文) */
.rc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rc-top .av-xs{width:32px;height:32px;font-size:12px;flex:0 0 auto}
.rc-nm{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 移动端防横向滑动:根因修复 + 兜底 */
html,body{overflow-x:clip;max-width:100%}
.para .en,.para .zh,.reader{overflow-wrap:anywhere;word-break:break-word}
mjx-container[display="true"],.mjx-container{max-width:100%!important;overflow-x:auto;overflow-y:hidden}
.reader table{display:block;max-width:100%;overflow-x:auto}
.reader img,.reader pre{max-width:100%}

/* 阅读操作栏:移动端收进下拉(参照 aipodcast) */
.rb-drop{display:contents}
.rb-more{display:none;border:none;background:var(--surface2);color:var(--ink);font-size:17px;line-height:1;padding:7px 12px;border-radius:9px;cursor:pointer;font-family:inherit;align-items:center;justify-content:center}
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']],macros:{bm:['\\boldsymbol{#1}',1],argmin:['\\operatorname*{arg\\,min}'],argmax:['\\operatorname*{arg\\,max}'],bx:'\\mathbf{x}',mathsfit:['\\mathsf{#1}',1]}},svg:{fontCache:'global'},options:{enableMenu:false}};</script>
<script>
/* MathJax 按需加载:这个库 gzip 后 678KB,比整个站的 HTML 还大,但全站只有约两成论文含公式,
   首页/列表/学者页一个公式都没有。改成渲染完检测到公式定界符才注入,没公式的页面完全不拉。 */
window._mjLoad=null;
window.ensureMathJax=function(){
  if(window._mjLoad)return window._mjLoad;
  window._mjLoad=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';
    s.async=true; s.onload=function(){res();}; s.onerror=rej;
    document.head.appendChild(s);
  });
  return window._mjLoad;
};
/* 只认配置里声明的定界符 \( \) 与 \[ \],外加环境写法 \begin{ */
window._MATH_RE=/\\\(|\\\[|\\begin\{/;
window.typesetIfMath=function(el,done){
  if(!el||!window._MATH_RE.test(el.textContent||'')){ if(done)done(); return; }
  window.ensureMathJax()
    .then(function(){return MathJax.startup.promise;})
    .then(function(){return MathJax.typesetPromise([el]);})
    .then(function(){if(done)done();})
    .catch(function(){if(done)done();});
};
</script>
